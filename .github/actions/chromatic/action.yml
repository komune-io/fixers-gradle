name: "Deploy On Chromatic"
description: "Deploy your app to Chromatic for visual regression testing. This action uses Make for linting, building, testing, and packaging, then publishes Storybook to Chromatic."
inputs:
  storybook-dir:
    description: "Storybook base directory"
    required: false
    default: "."

  storybook-static-dir:
    description: "Path to the storybook-static"
    required: true

  storybook-static-dir-separator:
    description: "Path separator between storybook-dir and storybook-static-dir"
    required: false
    default: "/"

  project-token:
    description: "Chromatic project token for publishing"
    required: true

runs:
  using: "composite"
  steps:
    # The caller is expected to have checked out the repository with
    # fetch-depth: 0 already — Chromatic needs the full history to diff builds.
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.storybook-static-dir }}
        path: ${{ inputs.storybook-dir }}${{ inputs.storybook-static-dir-separator }}${{ inputs.storybook-static-dir }}
    - name: Publish to Chromatic
      id: chromatic
      uses: chromaui/action@14cfaef73576e69f95f47f60058063f46ca38719 # v18.1.0
      with:
        projectToken: ${{ inputs.project-token }}
        workingDir: ${{ inputs.storybook-dir }}
        storybookBuildDir: ${{ inputs.storybook-static-dir }}

    - name: Chromatic Footer
      shell: bash
      run: |
        echo "## Deployed to Chromatic" >> $GITHUB_STEP_SUMMARY
        echo ""  >> $GITHUB_STEP_SUMMARY
        echo "Report: ${{ steps.chromatic.outputs.buildUrl }}" >> $GITHUB_STEP_SUMMARY
        echo ""  >> $GITHUB_STEP_SUMMARY
        echo "Preview: ${{ steps.chromatic.outputs.storybookUrl }}" >> $GITHUB_STEP_SUMMARY
