name: Dependabot Verification Metadata

# Reusable workflow: regenerates Gradle dependency verification metadata
# (gradle/verification-metadata.xml + keyring) on Dependabot PRs, so bumps of
# artifacts whose signing key is not yet trusted don't fail verification. Bumps
# signed by an already-trusted key produce no delta and no commit.
#
# The CALLER must use the pull_request_target trigger and grant permissions —
# Dependabot-triggered pull_request runs receive a read-only GITHUB_TOKEN, so a
# writable event is required to push the regenerated metadata. Minimal caller:
#
#   name: Dependabot Verification Metadata
#   on:
#     pull_request_target:
#       types: [opened, synchronize]
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
#     cancel-in-progress: true
#   permissions:
#     contents: write
#     actions: write
#     pull-requests: write
#     packages: read
#   jobs:
#     regenerate:
#       secrets:
#         push-token: ${{ secrets.DEPENDABOT_REGEN_PUSH_TOKEN }}
#       # Org-internal reusable, deliberately tracked @main like every komune-io
#       # workflow reference: central fixes must propagate to all callers
#       # without a pin-bump wave.
#       uses: komune-io/fixers-gradle/.github/workflows/dependabot-verification-workflow.yml@main # NOSONAR(githubactions:S7637)
#
# The NOSONAR marker suppresses SonarCloud's githubactions:S7637 ("use full
# commit SHA"), which fails the new-code security gate on any new caller file;
# Codacy's semgrep twin of the rule may need its own nosemgrep marker if the
# caller repo runs it.
#
# Safety model (why pull_request_target is acceptable here):
#   - the job is gated to actor == dependabot[bot] and same-repo head branches,
#     so the built code is a Dependabot-authored manifest bump, never a fork's;
#   - the only mutation is a metadata/keyring commit, reviewable in the PR diff.
# Trust caveat: the regen pins what the repositories serve at PR time
# (trust-on-first-use, same model as the original generation).
# Operational notes:
#   - pushes made with GITHUB_TOKEN do not trigger workflows, and neither a
#     rerun (uses the ORIGINAL merge SHA per GitHub docs) nor a dispatch (loses
#     PR context; Sonar then reports against the default branch) can produce a
#     correct fresh run. The push therefore uses the optional push-token secret
#     (a fine-grained PAT with contents:write): a PAT push triggers a normal
#     pull_request run with full PR context. The synchronize event also re-fires
#     this workflow, which finds zero delta and no-ops — no loop. Without the
#     secret, the push falls back to GITHUB_TOKEN and the PR comment tells the
#     reviewer to add any label — dev.yml listens to `labeled`, and a human
#     label event triggers a genuine fresh pull_request run;
#   - after this pushes, Dependabot refuses `@dependabot rebase`; use
#     `@dependabot recreate`.

on:
  workflow_call:
    inputs:
      make-file:
        description: "Makefile containing the regen target"
        required: false
        type: string
        default: "infra/make/libs.mk"
      regen-task:
        description: "Make target that regenerates metadata and keyring in place"
        required: false
        type: string
        default: "verify-metadata"
      dispatch-workflow:
        description: "Workflow whose latest pull_request run is re-run after pushing (rerun re-resolves the PR merge ref, preserving PR context for SonarCloud decoration)"
        required: false
        type: string
        default: "dev.yml"
      java-version:
        description: "Java version for the regen build"
        required: false
        type: string
        default: "17"
    secrets:
      push-token:
        description: "Fine-grained PAT (contents:write) used to push the metadata commit so that a normal pull_request run triggers. Falls back to GITHUB_TOKEN (no automatic CI re-run) when absent."
        required: false

jobs:
  # Job 1 — runs the untrusted build. No token anywhere: not on disk
  # (persist-credentials off) and not in any step's environment. A compromised
  # buildscript plugin executing during the regen can therefore neither read a
  # credential nor plant something that later receives one — the workspace it
  # could poison (.git/hooks, .git/config) is discarded with this runner.
  regenerate:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Downgraded token: the regen resolves io.komune snapshots from GitHub
    # Packages, which requires authentication even for public packages. With
    # contents/packages read-only, exposing this job's token to the untrusted
    # build is acceptable — it can read, never write. The write token still
    # exists only in the push job.
    permissions:
      contents: read
      packages: read
    outputs:
      changed: ${{ steps.delta.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      # org-internal action, tracked @main across all komune-io workflows by design
      # nosemgrep: yaml.github-actions.security.third-party-action-not-pinned-to-commit-sha.third-party-action-not-pinned-to-commit-sha
      - uses: komune-io/fixers-gradle/.github/actions/jvm@main
        with:
          java-version: ${{ inputs.java-version }}
          with-gradle-build-scan-publish: false

      - name: Regenerate verification metadata
        env:
          # read by the init script from setup-gradle-github-pkg for maven.pkg.github.com
          FIXERS_PUBLISH_GITHUB_USERNAME: ${{ github.actor }}
          FIXERS_PUBLISH_GITHUB_TOKEN: ${{ github.token }}
        run: make -f ${{ inputs.make-file }} ${{ inputs.regen-task }}

      - name: Detect changes
        id: delta
        run: |
          if git status --porcelain -- gradle/verification-metadata.xml gradle/verification-keyring.keys gradle/verification-keyring.gpg | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Verification metadata already covers this bump — nothing to commit."
          fi

      - name: Upload regenerated metadata
        if: steps.delta.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verification-metadata
          path: |
            gradle/verification-metadata.xml
            gradle/verification-keyring.keys
            gradle/verification-keyring.gpg
          if-no-files-found: error
          retention-days: 1

  # Job 2 — the only job that ever sees the token. Fresh runner, fresh pristine
  # checkout (no Gradle has run here, so no planted hooks or config), data
  # transferred exclusively as an inert artifact.
  push:
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Apply regenerated metadata
        uses: actions/download-artifact@v8
        with:
          name: verification-metadata
          path: gradle/

      - name: Commit and push metadata
        id: push
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PUSH_TOKEN: ${{ secrets.push-token }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml gradle/verification-keyring.keys gradle/verification-keyring.gpg
          git commit -m "build: regenerate dependency verification metadata for dependabot bump"
          if [ -n "$PUSH_TOKEN" ]; then
            # PAT push: triggers a normal pull_request run with full PR context
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:$HEAD_REF"
            echo "auto_ci=true" >> "$GITHUB_OUTPUT"
          else
            # GITHUB_TOKEN push: no workflow will trigger; the PR comment explains
            git push "https://x-access-token:${FALLBACK_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:$HEAD_REF"
            echo "auto_ci=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_CI: ${{ steps.push.outputs.auto_ci }}
        run: |
          if [ "$AUTO_CI" = "true" ]; then
            note="CI re-runs automatically on the new commit."
          else
            note="Checks do NOT re-run automatically on this commit (GITHUB_TOKEN pushes trigger no workflows, and re-running the old check would build the stale merge commit). To re-run them: **add any label to this PR** — a human label event triggers a fresh pull_request run with the new metadata. (Optional alternative for full automation: configure the push-token secret.)"
          fi
          gh pr comment "${{ github.event.pull_request.number }}" -R "${{ github.repository }}" --body \
          "Dependency verification metadata regenerated and committed for this bump. $note Review the metadata delta before merging. Note: with this extra commit, \`@dependabot rebase\` will be refused — use \`@dependabot recreate\` if the PR needs rebuilding."
