version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    # "/" only covers .github/workflows; the composite actions under
    # .github/actions/*/action.yml need to be listed explicitly so their
    # SHA-pinned `uses:` are kept up to date too.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
  # The images of the Spring Boot image convention (BootImageConvention.kt), pinned by tag and digest in
  # build-composite/boot-images/Dockerfile. One PR for all of them: the run image must stay the builder's.
  - package-ecosystem: "docker"
    directory: "/build-composite/boot-images"
    schedule:
      interval: "weekly"
    groups:
      paketo:
        patterns:
          - "paketobuildpacks/*"
