[versions]
detekt = "2.0.0-alpha.6"
kotlin = "2.4.21"
sonarQube = "7.5.0.8588"
npmPublish = "3.7.0"
gradlePublish = "2.2.1"
junit-jupiter = "6.1.3"
assertj = "3.27.7"
mockito = "5.24.0"
mockito-kotlin = "6.4.0"
coroutines = "1.11.0"
jacoco = "0.8.15"
# Forced on KGP's kotlinBouncyCastleConfiguration by the published plugin (BouncyCastleAlignment.kt):
# KGP 2.4.21 pins 1.84 (GHSA-9pwp-9qqc-pr26, GHSA-qp49-qgx5-5m26, fixed in 1.85). Remove this version
# with alignBouncyCastle once KGP's own `bouncyCastleVersion` is 1.85 or later: check
# `project.properties` in the kotlin-gradle-plugin jar.
bouncycastle = "1.86"

# Yarn resolutions the published plugin forces on the Kotlin/JS lock of every build
# (FIXERS_YARN_PINS in YarnResolutionCheck.kt): transitives of the Kotlin and ktor JS dependencies
# whose declared versions carry an advisory. ktor-client-core 3.6.1 declares ws 8.20.1 (GHSA-96hv-2xvq-fx4p,
# fixed in 8.21.0); ajv before 8.18.0 (CVE-2025-69873). Remove a pin once the dependency declares
# a fixed version.
npm-ws = "8.22.2"
npm-ajv = "8.20.0"

[libraries]
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
npmPublishGradlePlugin = { module = "org.jetbrains.kotlin:npm-publish-gradle-plugin", version.ref = "npmPublish" }
detektGradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
sonarqubeGradlePlugin = { module = "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin", version.ref = "sonarQube" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }

[bundles]
test = [
    "junit-jupiter",
    "assertj-core",
]

[plugins]
gradlePublish = { id = "com.gradle.plugin-publish", version.ref = "gradlePublish" }
